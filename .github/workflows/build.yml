name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Test
        run: xvfb-run -a mvn -s maven-settings.xml -Dmaven.compiler.release=17 test
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Package
        run: mvn -s maven-settings.xml -Dmaven.compiler.release=17 -DskipTests package
      - name: Collect jars
        run: |
          mkdir -p dist
          cp mcp-swing-17-agent/target/mcp-swing-17-agent-1.5.0-java17.jar dist/mcp-swing-17-agent.jar
          cp mcp-swing-17-server/target/mcp-swing-17-server-1.5.0-java17.jar dist/mcp-swing-17-server.jar
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-swing-17-jars
          path: dist/*.jar
